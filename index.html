<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harsha Enterprises</title>

<style>
body { font-family: Arial; margin:0; background:#f5f7fa; }

/* HEADER */
header { background:#0d1b2a; color:white; text-align:center; padding:15px; }

/* GRID */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px; padding:20px;
}

/* CARD */
.card {
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  cursor:pointer;
}
.card img { width:100%; height:180px; object-fit:cover; }

/* PRODUCT */
.product { background:white; padding:10px; border-radius:10px; text-align:center; }
.product img { width:100%; height:150px; object-fit:cover; }

/* BUTTONS */
.btn { padding:5px 10px; margin:3px; cursor:pointer; }

/* CART */
#cartIcon {
  position:fixed; top:20px; right:20px;
  background:#0d1b2a; color:white;
  padding:10px; border-radius:50%;
  cursor:pointer;
}

#cartBox {
  position:fixed; right:0; top:0;
  width:300px; height:100%;
  background:white; box-shadow:-2px 0 10px rgba(0,0,0,0.2);
  display:none; padding:15px; overflow:auto;
}
</style>
</head>

<body>

<header><h2>Harsha Enterprises</h2></header>

<div id="cartIcon" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>

<div id="cartBox">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<button onclick="checkout()">Send via WhatsApp</button>
</div>

<!-- MAIN -->
<div id="main" class="grid"></div>

<!-- LEVEL 2 -->
<div id="level2" class="grid" style="display:none;"></div>

<!-- LEVEL 3 -->
<div id="level3" class="grid" style="display:none;"></div>

<script>
const phone = "918892660649";

const data = {
  cotton: {
    name:"Cotton Waste",
    categories:{
      "White Banian Cloth (WHP)": ["cotton1.jpg","cotton2.jpg"],
      "Color Cloth Waste": ["cotton3.jpg"],
      "Others": ["cotton4.jpg"]
    }
  },

  abrasives:{
    name:"Abrasives",
    categories:{
      "Sandpaper":["sand1.jpg"],
      "Grinding Wheels":["grind1.jpg"],
      "Others":["other.jpg"]
    }
  }
};

let cart = {};

function loadMain(){
  main.innerHTML="";
  for(let key in data){
    main.innerHTML+=`
    <div class="card" onclick="openLevel2('${key}')">
      <img src="images/${key}-cover.jpg">
      <h3>${data[key].name}</h3>
    </div>`;
  }
}

function openLevel2(key){
  main.style.display="none";
  level2.style.display="grid";
  level2.innerHTML="";

  for(let cat in data[key].categories){
    level2.innerHTML+=`
    <div class="card" onclick="openLevel3('${key}','${cat}')">
      <h3>${cat}</h3>
    </div>`;
  }
}

function openLevel3(key,cat){
  level2.style.display="none";
  level3.style.display="grid";
  level3.innerHTML="";

  data[key].categories[cat].forEach(img=>{
    level3.innerHTML+=`
    <div class="product">
      <img src="images/${img}">
      <p>${cat}</p>
      <button onclick="addToCart('${cat}')">Add</button>
    </div>`;
  });
}

function addToCart(item){
  cart[item]=(cart[item]||0)+1;
  updateCart();
}

function updateCart(){
  cartCount.innerText=Object.values(cart).reduce((a,b)=>a+b,0);
  cartItems.innerHTML="";
  for(let i in cart){
    cartItems.innerHTML+=`${i} - ${cart[i]}<br>`;
  }
}

function toggleCart(){
  cartBox.style.display=cartBox.style.display==="block"?"none":"block";
}

function checkout(){
  let msg="Order:%0A";
  for(let i in cart){
    msg+=`${i} - ${cart[i]}%0A`;
  }
  window.open(`https://wa.me/${phone}?text=${msg}`);
}

loadMain();
</script>

</body>
</html>
