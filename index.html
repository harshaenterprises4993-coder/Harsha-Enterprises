<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harsha Enterprises</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f7fa;
}

/* HEADER */
header {
  background: #0d1b2a;
  color: white;
  padding: 15px;
  text-align: center;
}

/* HERO */
.hero {
  position: relative;
}
.hero img {
  width: 100%;
  height: 300px;
  object-fit: cover;
}
.hero h1 {
  position: absolute;
  bottom: 20px;
  left: 20px;
  color: white;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

/* CATEGORY CARD */
.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
  cursor: pointer;
  transition: 0.3s;
}
.card:hover {
  transform: scale(1.05);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.card h3 {
  text-align: center;
  padding: 10px;
}

/* SUB PRODUCTS */
#subProducts {
  display: none;
}

.back-btn {
  margin: 20px;
  padding: 10px 15px;
  border: none;
  background: #0d1b2a;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

.product {
  background: white;
  padding: 10px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.product img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
}

</style>
</head>

<body>

<header>
  <h2>Harsha Enterprises</h2>
</header>

<!-- HERO -->
<div class="hero">
  <img src="images/banner.jpg">
  <h1>Industrial Supplies & Cotton Waste</h1>
</div>

<!-- MAIN CATEGORIES -->
<div id="categories" class="grid">

  <div class="card" onclick="showProducts('abrasives')">
    <img src="images/abrasives-cover.jpg">
    <h3>Abrasives</h3>
  </div>

  <div class="card" onclick="showProducts('packing')">
    <img src="images/packing-cover.jpg">
    <h3>Packing Materials</h3>
  </div>

  <div class="card" onclick="showProducts('cotton')">
    <img src="images/cotton-cover.jpg">
    <h3>Cotton Waste</h3>
  </div>

</div>

<!-- SUB PRODUCTS -->
<div id="subProducts">
  <button class="back-btn" onclick="goBack()">← Back</button>
  <div id="productList" class="grid"></div>
</div>

<script>
const data = {
  abrasives: [
    {name: "Grinding Wheel", img: "images/grinding.jpg"},
    {name: "Polishing Disc", img: "images/polish.jpg"}
  ],

  packing: [
    {name: "Stretch Film", img: "images/stretch.jpg"},
    {name: "Bubble Roll", img: "images/bubble.jpg"},
    {name: "Foam Roll", img: "images/foam.jpg"},
    {name: "PP Covers", img: "images/pp.jpg"}
  ],

  cotton: [
    {name: "White Cotton Waste", img: "images/cotton1.jpg"},
    {name: "Colored Cotton Waste", img: "images/cotton2.jpg"}
  ]
};

function showProducts(category) {
  document.getElementById("categories").style.display = "none";
  document.getElementById("subProducts").style.display = "block";

  const list = document.getElementById("productList");
  list.innerHTML = "";

  data[category].forEach(item => {
    list.innerHTML += `
      <div class="product">
        <img src="${item.img}">
        <p>${item.name}</p>
      </div>
    `;
  });
}

function goBack() {
  document.getElementById("categories").style.display = "grid";
  document.getElementById("subProducts").style.display = "none";
}
</script>

</body>
</html>
